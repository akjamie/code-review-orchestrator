name: Agent Evaluation & Red-Teaming Gate

on:
  pull_request:
    paths:
      - 'src/main/resources/prompts/**'
      - 'src/main/java/org/akj/reviewer/agent/**'
      - 'src/main/java/org/akj/reviewer/orchestrator/**'
      - 'src/test/resources/eval/**'
  workflow_dispatch:

jobs:
  eval:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'

      - name: Make Gradle Wrapper Executable
        run: chmod +x gradlew

      - name: Run Eval Suite & Red-Teaming Tests
        run: ./gradlew test --tests "org.akj.reviewer.eval.*"
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}

      - name: Upload Eval Report Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eval-report
          path: build/eval/eval_report.md
