spring:
  threads:
    virtual:
      enabled: true
  ai:
    deepseek:
      api-key: ${DEEPSEEK_API_KEY}
      chat:
        model: ${MODEL_NAME:deepseek-v4-flash}
        temperature: 0.3
    mcp:
      client:
        request-timeout: PT45S
        # Local stdio connections for MCP servers
        stdio:
          connections:
            github-mcp:
              command: npx
              args:
                - "--no-install"
                - "@modelcontextprotocol/server-github"
              env:
                GITHUB_PERSONAL_ACCESS_TOKEN: ${GITHUB_TOKEN}
            context7-mcp:
              command: npx
              args:
                - "--no-install"
                - "@upstash/context7-mcp"
              env:
                CONTEXT7_API_KEY: ${CONTEXT7_API_KEY:}
        toolcallback:
          enabled: true

review:
  agents:
    max-tokens: 4096
    timeout-seconds: 120
    enabled:
      security: true
      performance: true
      style: true
      test-coverage: true
  synthesizer:
    max-tokens: 8192
  # MCP Review Agent settings
  mcp-agent:
    enabled: true
    max-tokens: 8192
    model: ${MCP_MODEL_NAME:${MODEL_NAME:deepseek-chat}}
  # Background polling monitor settings
  polling:
    enabled: ${POLLING_ENABLED:false}
    interval-seconds: ${POLLING_INTERVAL_SECONDS:60}
  # Comma-separated list of repos to monitor (e.g. "owner/repo1,owner/repo2")
  # Leave empty to allow all repos
  monitored-repos: ${MONITORED_REPOS:}
  # Skip review runs if there are pending/unresolved comments on the PR
  skip-on-unresolved-comments: ${SKIP_ON_UNRESOLVED_COMMENTS:true}

github:
  webhook-secret: ${GITHUB_WEBHOOK_SECRET:}
  token: ${GITHUB_TOKEN}

logging:
  level:
    org.springframework.ai: DEBUG
    io.modelcontextprotocol: DEBUG